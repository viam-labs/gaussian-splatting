[project]
name = "gaussian-splatting"
version = "0.0.1"
description = "Viam module: scan a region with an arm-mounted camera, upload a sequence dataset, build a Gaussian splat with 3DGRUT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "viam-sdk>=0.85",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "typer>=0.12",
]

[project.optional-dependencies]
# splat-build runs on a laptop or GPU box, never on the robot; keep these out of the module tarball's venv.
build = [
    "pycolmap>=3.11",
    "pyarrow>=17",
]

[project.scripts]
splat-scan = "gaussian_splatting.scan_cli:app"
splat-build = "gaussian_splatting.build.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pycolmap>=3.11",
    "pyarrow>=17",
    "pyarrow-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaussian_splatting"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# viam-sdk ships py.typed but leaves many functions unannotated; pycolmap has no stubs.
disallow_untyped_calls = false
[[tool.mypy.overrides]]
module = ["pycolmap", "pycolmap.*", "cv2", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running viam-server (dev/local-machine.json)"]
addopts = "-m 'not integration'"
